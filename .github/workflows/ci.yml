name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install ruff -r infra/requirements.txt -r backend/requirements.txt
      - run: ruff check infra backend db
      - name: cdk synth
        working-directory: infra
        run: npx --yes aws-cdk@2 synth --quiet
